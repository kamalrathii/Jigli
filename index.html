 <!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I'm Sorry 💖</title>
  <style>
    body {
      margin: 0;
      font-family: 'Comic Sans MS', cursive;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    }/* Floating hearts background */
.heart {
  position: absolute;
  width: 20px;
  height: 20px;
  background: pink;
  transform: rotate(45deg);
  animation: float 6s linear infinite;
  opacity: 0.6;
}

.heart::before,
.heart::after {
  content: '';
  position: absolute;
  width: 20px;
  height: 20px;
  background: pink;
  border-radius: 50%;
}

.heart::before {
  top: -10px;
  left: 0;
}

.heart::after {
  left: -10px;
  top: 0;
}

@keyframes float {
  0% { transform: translateY(100vh) rotate(45deg); }
  100% { transform: translateY(-10vh) rotate(45deg); }
}

.card {
  background: white;
  padding: 40px;
  border-radius: 25px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.2);
  max-width: 400px;
  text-align: center;
  position: relative;
  z-index: 2;
}

h1 {
  color: #ff4d6d;
  font-size: 2.2rem;
}

p {
  color: #555;
  font-size: 1.2rem;
}

.btn {
  margin-top: 20px;
  padding: 14px 26px;
  border: none;
  border-radius: 30px;
  font-size: 18px;
  cursor: pointer;
  transition: 0.3s;
}

.forgive {
  background: #ff4d6d;
  color: white;
}

.forgive:hover {
  background: #ff1e4d;
  transform: scale(1.1);
}

.no {
  background: #ccc;
  position: fixed;
}

  </style>
</head>
<body>  <div class="card">
    <h1>Jigyasa (TIM TIM) 💖</h1>
    <p>I'm really sorry maaf kardo wo me thoda chota sa hu galti se hojata he 😔<br>Please forgive me?</p><button class="btn forgive" onclick="forgive()">Yes 💕</button>
<button class="btn no" id="noBtn">No 😤</button>

  </div>  <script>
    function forgive() {
      document.body.innerHTML = "<h1 style='color:white; font-size:3rem; text-align:center;'>YAYYY 💕 Thank you!! hihihi me hu hi itna payara 🥰</h1>";
    }

    const noBtn = document.getElementById('noBtn');

    function moveButton() {
      const maxX = window.innerWidth - noBtn.offsetWidth;
      const maxY = window.innerHeight - noBtn.offsetHeight;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    }

    noBtn.addEventListener('mouseenter', moveButton);
    noBtn.addEventListener('click', moveButton);

    // Create floating hearts
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (3 + Math.random() * 3) + 's';
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

    setInterval(createHeart, 300);
  </script></body>
 </html>
