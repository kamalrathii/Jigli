<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <title>I'm Sorry 💖</title>
  <style>
    body {
      margin: 0;
      font-family: 'Comic Sans MS', cursive;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }.card {
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  max-width: 350px;
}

h1 {
  color: #ff4d6d;
}

p {
  color: #555;
}

.btn {
  margin-top: 20px;
  padding: 10px 20px;
  border: none;
  border-radius: 25px;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

.forgive {
  background: #ff4d6d;
  color: white;
}

.forgive:hover {
  background: #ff1e4d;
}

.no {
  background: #ccc;
  color: black;
  position: absolute;
}

  </style>
</head>
<body>  <div class="card">
    <h1>Jigayasa 💖</h1>
    <p>I'm really sorry 😔<br>
    Please forgive me?</p><button class="btn forgive" onclick="forgive()">Yes 💕</button>
<button class="btn no" id="noBtn">No 😤</button>

  </div>  <script>
    function forgive() {
      document.body.innerHTML = "<h1 style='color:white;'>YAYYY 💕 Thank you!! 🥰</h1>";
    }

    const noBtn = document.getElementById('noBtn');

    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() * window.innerWidth;
      const y = Math.random() * window.innerHeight;
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    });
  </script></body>
</html>
